name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel dropped from the matrix: its runners have repeatedly
        # failed CI for reasons external to this tap's formulae -- most
        # recently, reproducible DNS resolution failures (Could not resolve
        # host: ftpmirror.gnu.org / gmplib.org) fetching shellcheck's gmp
        # dependency during only-tap-syntax, and previously, Homebrew no
        # longer bottling openssl@3 for Intel macOS. Not worth carving out
        # exceptions for a runner type that keeps finding new ways to fail.
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      # Formula tests fetch any already-published bottles from GHCR
      # (ghcr.io/kylerjensen/tap); read access lets the test registry token
      # authenticate against private packages.
      packages: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Base64-encode GITHUB_TOKEN into the form test-bot expects for pulling
      # bottles from GHCR during the formula-install test.
      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      # Build + test the bottle on both PRs and pushes to main. --root-url
      # points the built bottle's metadata at GHCR so it matches the formula's
      # root_url; the registry token lets the install step pull dependency
      # bottles already published there. Previously PR-only, but the publish
      # job below needs the freshly built *.bottle.json on push to main too.
      - run: brew test-bot --only-formulae --root-url=https://ghcr.io/v2/kylerjensen/tap
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'

  # Fan-in: merge every runner's bottle sha256 into the formula, commit the
  # refreshed bottle block, and push the OCI blobs to GHCR. This replaces the
  # old `brew pr-pull` label-merge procedure entirely. The build matrix above
  # fans out (one bottle per platform); this job fans in.
  #
  # Flow (order is load-bearing, see below):
  #   1. download all per-runner *.bottle.json into one dir
  #   2. `brew bottle --merge --write --no-commit` rewrites the .rb sha256
  #   3. if the .rb changed, commit it back to the branch (PR) or main (push)
  #   4. `brew pr-upload --upload-only` pushes the blobs to GHCR
  #
  # Merge -> commit -> upload is required: `brew pr-upload`'s
  # check_transition_bottles! re-reads the committed .rb and fails if its
  # bottle metadata doesn't match the uploaded blobs.
  #
  # The commit in step 3 uses the default GITHUB_TOKEN, so GitHub does NOT
  # re-trigger a workflow run for it -- this both avoids an infinite loop and
  # means the committed bottle isn't independently re-verified (it was already
  # install-tested by test-bot in the build job that produced it). When a
  # bottle is already current (e.g. a docs-only push to main), step 2 produces
  # no diff and the job is a no-op.
  publish-bottles:
    needs: test-bot
    runs-on: ubuntu-latest
    container: ghcr.io/homebrew/brew:main
    permissions:
      contents: write
      packages: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@main

      - name: Download all bottle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bottles_*
          merge-multiple: true
          path: bottles

      # Skip the whole publish on fork PRs: CI has no write access to a fork's
      # branch, so the commit-back and GHCR push would fail. Those still need a
      # maintainer to re-run from a branch in this repo. On push to main and on
      # same-repo PRs, head.repo.full_name is either empty or equal to the repo.
      - name: Guard against fork PRs
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -n "${HEAD_REPO}" ] && [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
            echo "Fork PR (${HEAD_REPO}); skipping bottle publish."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      # setup-homebrew taps the repo at its default branch and leaves the tap's
      # git auth configured for the whole job via its `token` input. Move the
      # tap onto the exact ref CI built (the PR head branch, or main for a push)
      # so the merge/commit/upload all operate on the tree whose formula was
      # bottled.
      - name: Check out target ref in the tap
        if: steps.guard.outputs.skip == 'false'
        id: checkout
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          tap_dir="$(brew --repository "${GITHUB_REPOSITORY}")"
          cd "${tap_dir}"
          git config --global --add safe.directory "${tap_dir}"
          git fetch origin "${TARGET_REF}"
          git checkout -B "${TARGET_REF}" "origin/${TARGET_REF}"
          echo "tap_dir=${tap_dir}" >> "${GITHUB_OUTPUT}"

      - name: Merge bottle sha256 into formulae
        if: steps.guard.outputs.skip == 'false'
        id: merge
        run: |
          shopt -s nullglob
          jsons=(bottles/*.bottle.json)
          if [ ${#jsons[@]} -eq 0 ]; then
            echo "No bottle JSON produced; nothing to publish."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # brew bottle --merge resolves formulae via the tap, so pass absolute
          # JSON paths and run from the tapped checkout prepared above. --write
          # --no-commit rewrites the .rb sha256 without committing (we commit
          # the result ourselves in the next step).
          abs_jsons=()
          for j in "${jsons[@]}"; do abs_jsons+=("$(pwd)/$j"); done
          cd "$(brew --repository "${GITHUB_REPOSITORY}")"
          brew bottle --merge --write --no-commit "${abs_jsons[@]}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      # Commit the refreshed bottle block in the tapped checkout. No push here;
      # git-try-push below does the race-safe push (rebasing on origin drift).
      # The commit uses GITHUB_TOKEN, so GitHub does not re-trigger CI for it.
      - name: Commit refreshed bottle block
        if: steps.guard.outputs.skip == 'false' && steps.merge.outputs.changed == 'true'
        id: commit
        env:
          GIT_NAME: ${{ steps.git_setup.outputs.name }}
          GIT_EMAIL: ${{ steps.git_setup.outputs.email }}
        run: |
          cd "$(brew --repository "${GITHUB_REPOSITORY}")"
          if git diff --quiet -- Formula Casks; then
            echo "Bottle block already up to date; no commit needed."
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "${GIT_NAME}"
          git config user.email "${GIT_EMAIL}"
          git add Formula Casks
          git commit -m "Update bottles."
          echo "committed=true" >> "${GITHUB_OUTPUT}"

      - name: Push bottle commit
        if: steps.commit.outputs.committed == 'true'
        uses: Homebrew/actions/git-try-push@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ steps.checkout.outputs.tap_dir }}
          branch: ${{ github.event.pull_request.head.ref || github.ref_name }}

      # pr-upload globs *.bottle.json in the cwd and pushes the OCI blobs to
      # GHCR; it reads the merged bottle metadata from the tapped formula, so
      # the commit above must already be in the working tree. --upload-only
      # skips pr-upload's own merge (we already merged). Guarded on merge, not
      # commit: even if the .rb block didn't change (same sha256), re-uploading
      # is a safe no-op that self-skips when the blob already exists.
      - name: Upload bottles to GHCR
        if: steps.guard.outputs.skip == 'false' && steps.merge.outputs.changed == 'true'
        working-directory: bottles
        env:
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew pr-upload --upload-only --root-url=https://ghcr.io/v2/kylerjensen/tap
