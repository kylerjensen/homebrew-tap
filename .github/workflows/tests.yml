name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # macos-15-intel: Homebrew no longer bottles openssl@3 (a python@3.13
      # dependency) for Intel macOS -- an upstream platform deprecation
      # (Homebrew's own install output: "we do not provide support for this
      # platform"), not something a formula can fix.
      #
      # ubuntu-latest: `brew linkage --test` reports libtorch.so/libc10.so as
      # missing even though they exist and import fine -- confirmed via a
      # minimal test formula that does nothing but `pip install torch`, so
      # it's PyTorch's own manylinux wheel layout tripping up Homebrew's
      # linkage checker, not headroom-ai's code. There's no per-library
      # opt-out available from a tap (Homebrew's own allowlist for this is
      # hardcoded to specific formula names in Homebrew/brew itself), so the
      # whole step is tolerated on this one platform only.
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ matrix.os == 'macos-15-intel' || matrix.os == 'ubuntu-latest' }}

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
